name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: windows-latest
            arch: x64

    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download MinGit
        if: runner.os == 'Windows'
        run: node scripts/download-git-portable.js

      - name: Build server bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            node scripts/build-server.mjs darwin ${{ matrix.arch }}
          else
            node scripts/build-server.mjs win32 ${{ matrix.arch }}
          fi

      - name: Build Computer Use helper
        if: runner.os == 'macOS'
        shell: bash
        run: HANA_COMPUTER_USE_HELPER_ARCH=${{ matrix.arch }} node scripts/build-computer-use-helper.mjs ${{ matrix.arch }}

      - name: Build Windows sandbox helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/build-windows-sandbox-helper.mjs ${{ matrix.arch }}

      - name: Build client bundles
        run: npm run build:client

      - name: Disable macOS signing when certificate is missing
        if: runner.os == 'macOS' && env.CSC_LINK == ''
        run: |
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          echo "SKIP_NOTARIZE=true" >> "$GITHUB_ENV"
          node -e "const fs=require('node:fs'); const p=require('./package.json'); p.build.mac.identity=null; p.build.mac.hardenedRuntime=false; delete p.build.afterSign; fs.writeFileSync('package.json', JSON.stringify(p, null, 2));"

      - name: Setup macOS signing keychain
        if: runner.os == 'macOS' && env.CSC_LINK != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="ci-$(openssl rand -hex 12)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Pre-sign server binaries
        if: runner.os == 'macOS' && env.CSC_LINK != ''
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          DIST_SERVER="dist-server/mac-${{ matrix.arch }}"

          find "$DIST_SERVER/node_modules" -name "*.node" | while read f; do
            codesign --sign "$IDENTITY" --timestamp --force "$f"
          done

          codesign --sign "$IDENTITY" --timestamp --force --options runtime "$DIST_SERVER/node"

      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: |
          ulimit -n 65536
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 3
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists"
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

      - name: Generate merged latest-mac.yml
        run: node scripts/merge-latest-mac-yml.cjs artifacts latest-mac.yml

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          find artifacts \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0 |
            while IFS= read -r -d '' f; do
              gh release upload "${{ github.ref_name }}" "$f" --clobber
            done

          WIN_YML=$(find artifacts -name 'latest.yml' | head -1)
          if [ -n "$WIN_YML" ]; then
            gh release upload "${{ github.ref_name }}" "$WIN_YML" --clobber
          else
            echo "::error::latest.yml not found"
            exit 1
          fi

          gh release upload "${{ github.ref_name }}" latest-mac.yml --clobber

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ASSETS=$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name')
          echo "$ASSETS"

          MISSING=()
          echo "$ASSETS" | grep -qx 'latest-mac.yml' || MISSING+=("latest-mac.yml")
          echo "$ASSETS" | grep -qx 'latest.yml' || MISSING+=("latest.yml")
          echo "$ASSETS" | grep -qE '^openZetcX-0\.1\.0-macOS-arm64\.dmg$' || MISSING+=("macOS-arm64.dmg")
          echo "$ASSETS" | grep -qE '^openZetcX-0\.1\.0-macOS-arm64\.zip$' || MISSING+=("macOS-arm64.zip")
          echo "$ASSETS" | grep -qE '^openZetcX-0\.1\.0-macOS-x64\.dmg$' || MISSING+=("macOS-x64.dmg")
          echo "$ASSETS" | grep -qE '^openZetcX-0\.1\.0-macOS-x64\.zip$' || MISSING+=("macOS-x64.zip")
          echo "$ASSETS" | grep -qE '^openZetcX-0\.1\.0-Windows-x64\.exe$' || MISSING+=("Windows-x64.exe")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required assets: ${MISSING[*]}"
            exit 1
          fi

      - name: Mark as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --latest
