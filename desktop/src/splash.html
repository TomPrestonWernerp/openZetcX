<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' file:;">
    <title>openZetcX</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Songti SC', 'Georgia', serif;
            background: #F4F0E4;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -webkit-app-region: drag;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .splash-avatar {
            width: 72px; height: 72px;
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
            user-select: none;
        }
        .splash-text-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            justify-content: center;
        }
        .splash-text {
            font-size: 0.82rem;
            color: #8E9196;
            letter-spacing: 0.02em;
            line-height: 1.5;
            transition: opacity 0.5s ease;
            white-space: nowrap;
        }
        .splash-text.switching { opacity: 0; }
        .splash-loader {
            width: 14px;
            height: 14px;
            display: inline-flex;
            flex: 0 0 14px;
            border-radius: 999px;
            border: 1.5px solid rgba(83, 125, 150, 0.22);
            border-top-color: currentColor;
            opacity: 0.9;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .splash-loader { animation-duration: 1.8s; }
        }
    </style>
</head>
<body>
    <div id="react-root"></div>
    <script src="modules/platform.js"></script>
    <script type="module" src="./splash-main.tsx"></script>
</body>
</html>
